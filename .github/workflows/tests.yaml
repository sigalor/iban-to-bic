name: Unit tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # Checkout the Repo
      - uses: actions/checkout@v5

      # Install Node 16
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 16

      # Install NPM dependencies
      - run: npm install

      # Run tests
      - run: npm test
